name: Publicar vista previa en GitHub Pages

on:
  push:
    branches:
      - enriquecimiento
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar vista previa
        id: deployment
        uses: actions/deploy-pages@v4
